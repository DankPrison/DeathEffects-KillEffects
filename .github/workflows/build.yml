name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also checks that gradle/wrapper/gradle-wrapper.jar is an official Gradle release.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: plugins
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"
            exit 1
          fi

      - name: Take the release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          # The lines under "## <version>" up to the next "## " heading, without the blank lines at the start.
          awk -v version="$version" '
            /^## / { if (found) exit; found = ($2 "" == version ""); next }
            found && (NF || started) { started = 1; print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::CHANGELOG.md has no notes under a '## $version' heading"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          # The changelog first, then GitHub's list of changes since the previous release.
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
