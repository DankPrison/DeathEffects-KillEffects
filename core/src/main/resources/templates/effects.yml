# ==============================================================================================
#  Reference
# ==============================================================================================
#
# Options every layer has:
#   type:       particle, firework, lightning, sound or animation
#   y:          height above the place of death (particles and fireworks: 1, others: 0)
#   delay:      ticks to wait before the layer starts (20 ticks = 1 second)
#   repeat:     how many times the layer plays (default 1)
#   interval:   ticks between repeats (default 5)
#
# ---- type: particle -------------------------------------------------------------------------
#   A burst of particles.
#   particle:   the particle, for example FLAME, HEART, CLOUD, DUST, ITEM or BLOCK
#               (all names: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Particle.html)
#   count:      number of particles (default 10)
#   offset:     how far they spread from the centre: one number, or [x, y, z] (default 0.3)
#   speed:      how fast they fly (default 0.05); for NOTE particles 1 gives random colours
#   item/items:   the item(s) for ITEM particles, for example  items: [DIAMOND, EMERALD]
#   block/blocks: the block(s) for BLOCK, FALLING_DUST and similar particles
#               With several items or blocks each of them gets its own burst of 'count' particles.
#   color:      colour of DUST, DUST_COLOR_TRANSITION, ENTITY_EFFECT and other coloured particles:
#               '#FF0000', '255,0,0', a name such as RED, a list of colours to cycle through,
#               RAINBOW or RANDOM
#   color2:     the second colour of DUST_COLOR_TRANSITION
#   size:       size of DUST particles (default 1)
#   value:      the note (0 to 24) that sets the colour of NOTE particles, or a number some newer
#               particles need, such as the roll of SCULK_CHARGE
#
# ---- type: firework -------------------------------------------------------------------------
#   Firework explosions. They never cause damage.
#   count:      number of fireworks (default 1)
#   spread:     how far apart they are (default 0.5)
#   shape:      BALL, BALL_LARGE, STAR, BURST, CREEPER, a list of these, or RANDOM (default)
#   colors:     colours like the 'color' of particles (default RANDOM)
#   color-count: how many random colours each firework gets (default 2)
#   fade-colors: colours the explosion fades to (optional)
#   flicker:    true, false or RANDOM (default)
#   trail:      true, false or RANDOM (default)
#   instant:    true explodes right away (default); false lets the rocket fly up first
#
# ---- type: lightning ------------------------------------------------------------------------
#   Lightning that looks and sounds real but never causes fire or damage.
#   count:      number of strikes (default 1)
#   spread:     how far apart they are (default 0)
#
# ---- type: sound ----------------------------------------------------------------------------
#   sound:      the sound, for example ENTITY_PLAYER_LEVELUP; vanilla keys such as
#               entity.player.levelup and resource pack sounds (mypack:my.sound) work too
#               (all names: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html)
#   volume:     1 can be heard about 16 blocks away (default 1)
#   pitch:      0.5 to 2 (default 1)
#
# ---- type: animation ------------------------------------------------------------------------
#   A shape drawn with particles over several ticks.
#   shape:      one of the shapes below
#   particle:   the particle, with the same extra options as particle layers (item, color, ...)
#   period:     ticks between two frames
#   duration:   how many ticks the animation lasts
#   Most shapes have their own options, all optional:
#
#   HELIX_CONE    strands spiralling up a narrowing cone (Blood Helix); period 3, duration 72
#                 radius: 1.25, height: 3.1, strands: 2, points: 33, rotation: 22.5 (degrees per frame)
#   SHOCKWAVE     a ring racing outwards in a fading wave (Nuke); period 1, duration 40
#                 second-particle: FLAME (drawn between the first, 'none' to turn off),
#                 start-radius: 0.8, max-radius: 10, growth: 0.314, points: 64, height: 1.5,
#                 amplitude: 2, damping: 0.1
#   RING_WAVE     stacked rings growing outwards (Circle); period 2, duration 12
#                 start-radius: 1, growth: 1, max-radius: 4, density: 10 (points per block of
#                 radius), rings: 3, ring-spacing: 1
#   VORTEX        helices twisting upwards (Vortex); period 1, duration 80
#                 radius: 2, grow: 0.05, radials: 11.25, circles: 3, helixes: 4, height: 5,
#                 direction: UP or FORWARD (the way the player faced)
#   DNA           a double helix with base pairs (DNA); period 1, duration 100
#                 base-particle: FISHING, base2-particle: DUST (with base2-color and so on),
#                 radius: 1.2, height: 6, grow: 0.1, radials: 6, particles-per-frame: 3,
#                 base-interval: 10, base-particles: 10, direction: UP or FORWARD
#   DISCO_BALL    a ball shooting beams of light (Disco); period 7, duration 105
#                 line-particle: DUST (with line-color and so on, 'none' to turn off),
#                 radius: 0.6, sphere-particles: 50, max-lines: 7, line-length: 15,
#                 line-particles: 40, direction: DOWN, UP or BOTH
#   DRAGON_BREATH arcs of fire breathed the way the player faced (Dragon); period 2, duration 60
#                 arcs: 20, particles: 30, steps-per-frame: 2, length: 4, pitch: 0.1
#   POLYGON       a polygon on the ground, a pentagram with connect-all (Pentagon); period 2,
#                 duration 100
#                 sides: 5, radius: 3, connect-all: true, density: 4 (points per block), spin: 0
#   SPHERE        particles on the surface of a ball; period 1, duration 40
#                 radius: 1.5, grow: 0 (added to the radius every frame), particles: 30
#   RING          a spinning ring; period 1, duration 40
#                 radius: 1.5, points: 24, spin: 10 (degrees per frame), tilt-x: 0, tilt-z: 0,
#                 wobble: 0
#   HELIX         curved arms spiralling out on the ground; period 4, duration 40
#                 strands: 6, points: 30, radius: 3, curve: 3, rotation: 15
#   TORNADO       a funnel crowned by a cloud; period 3, duration 80
#                 cloud-particle: LARGE_SMOKE ('none' to turn off), height: 5, max-radius: 2.5,
#                 spacing: 0.4, density: 8, cloud-size: 2.5, cloud-particles: 40, spin: 20
#   FOUNTAIN      arcs splashing out around a spout; period 2, duration 60
#                 strands: 10, strand-particles: 30, spout-particles: 40, radius: 2.5,
#                 spout-radius: 0.25, height: 2, spout-height: 3.5, rotation: 45
#
# Example of an effect of your own:
#
#   stars:
#     name: '&eStar &aEffect'
#     icon: NETHER_STAR
#     lore:
#       - '&7Seeing stars.'
#     layers:
#       - type: particle
#         particle: FIREWORK
#         count: 40
#         offset: 0.5
#         speed: 0.05
#       - type: animation
#         shape: RING
#         particle: DUST
#         color: '#FFD700'
#         radius: 1.5
#         duration: 40
#       - type: sound
#         sound: ENTITY_PLAYER_LEVELUP
#         pitch: 1.5
