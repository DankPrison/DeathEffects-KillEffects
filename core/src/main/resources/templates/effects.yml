# ==============================================================================================
#  @PLUGIN@ - effects
# ==============================================================================================
#
# Every effect is a section under 'effects'. Its key (for example 'flame') is the effect id,
# used in commands and permissions:  /@ALIAS@ select flame  needs  @PLUGIN_ID@.flame
#
#   name:        name shown in the menu and in messages (& colour codes, &#RRGGBB on 1.16+)
#   icon:        the menu item
#   lore:        lines shown under the name in the menu (optional)
#   permission:  the permission needed to use it (optional, the default is @PLUGIN_ID@.<id>);
#                '' means everybody may use the effect
#   order:       position in the menu (optional, the default is the order of this file)
#   enabled:     false removes the effect without deleting it (optional)
#   layers:      what the effect shows; all layers start together unless they have a 'delay'
#
# Item, sound and particle names are written for the Minecraft version of your server and are
# translated automatically when the server moves to another version. Names from other versions
# are understood as well. Where a value is a list, such as  sound: [A, B]  , the first name that
# exists on your version is used.
#
# Effect ids may contain letters, digits, '-' and '_'. Change this file, then run /@ALIAS@ reload.
# Every layer type and option is explained in the reference at the end of this file.

