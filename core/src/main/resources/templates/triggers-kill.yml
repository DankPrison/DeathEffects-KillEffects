# When @KIND@ effects play.
triggers:
  # The player killed another player.
  players: true
  # The player killed a mob.
  mobs: false
  # The player killed themselves, for example with their own arrow or TNT.
  self: false
  # Mobs that never play an effect when killed, for example [ARMOR_STAND, BAT].
  ignored-mobs: [ARMOR_STAND]
  # Deaths that another plugin cancelled. Duel and practice plugins do this to end a fight without the
  # death screen. true: the effect plays anyway. false: no effect, for example if a plugin cancels deaths
  # to revive players. StrikePractice also reports the deaths in its fights itself; those always count.
  cancelled-deaths: true

# Only matters when @OTHER_PLUGIN@ runs on the same server. When one player kills another, both the
# victim's death effect and the killer's kill effect play.
compatibility:
  # true: the kill effect is skipped whenever the victim's death effect plays.
  # If @OTHER_PLUGIN@ is set to skip its effect as well, the kill effect plays.
  skip-when-death-effect-plays: false
